<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mhd Sahl — Logo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;800&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .wrap {
      background: #0d1117;
      border-radius: 16px;
      padding: 60px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .grid-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(30,160,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,160,255,0.07) 1px, transparent 1px);
      background-size: 36px 36px;
      animation: drift 12s linear infinite;
    }
    @keyframes drift { to { background-position: 36px 36px; } }

    .scan {
      position: absolute; left: 0; width: 100%; height: 2px;
      background: rgba(30,160,255,0.15);
      animation: scan 4s ease-in-out infinite;
    }
    @keyframes scan {
      0%   { top: 0%;   opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .corner {
      position: absolute; width: 16px; height: 16px;
      border-color: rgba(30,160,255,0.4); border-style: solid;
      opacity: 0; animation: fc 0.4s ease 1.4s forwards;
    }
    .corner-tl { top: 14px; left: 14px;   border-width: 2px 0 0 2px; }
    .corner-tr { top: 14px; right: 14px;  border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 14px; left: 14px;  border-width: 0 0 2px 2px; }
    .corner-br { bottom: 14px; right: 14px; border-width: 0 2px 2px 0; }
    @keyframes fc { to { opacity: 1; } }

    .names {
      position: relative; z-index: 2;
      display: flex; align-items: baseline; gap: 16px;
    }

    .mhd {
      font-family: 'Inter', sans-serif; font-size: 72px; font-weight: 800;
      color: #e8eaf0; letter-spacing: -2px; line-height: 1;
      opacity: 0; transform: translateY(-20px);
      animation: dropIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.15s forwards;
    }

    .sahl {
      font-family: 'Inter', sans-serif; font-size: 72px; font-weight: 800;
      color: #1ea0ff; letter-spacing: -2px; line-height: 1;
      opacity: 0; transform: translateY(-20px);
      animation: dropIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
    }

    .cursor {
      display: inline-block; width: 4px; height: 58px;
      background: #1ea0ff; margin-left: 4px;
      vertical-align: middle; border-radius: 2px;
      animation: blink 1.1s step-end 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes dropIn { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid-bg"></div>
    <div class="scan"></div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="names">
      <span class="mhd">Mhd</span>
      <span class="sahl">Sahl<span class="cursor"></span></span>
    </div>
  </div>
</body>
</html>
